# Postgres settings for the low-memory mode (LOW_MEMORY=on, compose.small.yml), for a 1 GB server.
# Replaces postgresql.conf; anything not set here keeps the built-in default.
# This work made by Anfinogentov Nikita
listen_addresses = '*'
# every connection is a process of a few MB: the API, the worker and init keep at most 8 + 4 + 4 of them
# (MSI_DB_POOL_SIZE and MSI_DB_MAX_OVERFLOW in compose.small.yml) and recycle them every 5 minutes, so 30 leaves
# room for psql and backups. There I do not close idle sessions on the server side: after every quiet minute the
# pools would reopen all their connections at once, a burst of new processes inside the memory cap.
max_connections = 30
io_workers = 1
shared_buffers = 16MB
work_mem = 2MB
maintenance_work_mem = 16MB
temp_buffers = 4MB
wal_buffers = 1MB
effective_cache_size = 64MB
max_worker_processes = 4
max_parallel_workers = 1
max_parallel_workers_per_gather = 0
max_parallel_maintenance_workers = 1
autovacuum_max_workers = 1
huge_pages = off
log_timezone = 'UTC'
timezone = 'UTC'
