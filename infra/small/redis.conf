# Redis settings for the low-memory mode (LOW_MEMORY=on, compose.small.yml). The password comes on the command line.
# This work made by Anfinogentov Nikita
# Redis holds the sessions, sign-up codes and rate-limit counters: a few hundred bytes per user.
# There I use noeviction: with any LRU policy a full Redis would silently log people out or drop their codes;
# with noeviction a full Redis refuses new writes with an error in the API log instead, and 16 MB holds
# tens of thousands of sessions, far more than a site on a 1 GB server will see.
maxmemory 16mb
maxmemory-policy noeviction
appendonly yes
# a rewrite of the append-only file forks Redis; only when the file has really grown
auto-aof-rewrite-min-size 16mb
save ""
