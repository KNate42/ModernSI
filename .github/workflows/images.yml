# Builds the two images of the site (API and Next.js) for amd64 and arm64 and pushes them to GitHub's registry,
# so a small server (1 GB of RAM, x86-64 or ARM) pulls them with ./scripts/up.sh instead of building them itself.
#   ghcr.io/knate42/modernsi-api and ghcr.io/knate42/modernsi-web
#   tags: sha-<commit> for every build (what scripts/up.sh pulls with IMAGE_TAG=auto, so a server always runs the
#   images of the code it has checked out), latest for the default branch, and v1.2.0 for a release tag like that.
# latest and the release tag move only after both images are built, so they never point at a new API next to
# an old site or the other way round.
# The packages are private after the first push: make them public once (see "Prebuilt images" in README.md).
# This work made by Anfinogentov Nikita
name: images

on:
  push:
    branches: [KNate42.github.io]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# a newer push to the same branch or tag replaces a build that is still running
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: modernsi-api
            context: backend
          - name: modernsi-web
            context: frontend
    steps:
      - uses: actions/checkout@v4

      # There I build arm64 under QEMU on the x86 runner: slower than a native ARM runner, but one job per image
      # and no extra runner setup
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          # registry names must be lowercase, the owner is KNate42
          images: ghcr.io/knate42/${{ matrix.name }}
          tags: |
            type=sha,prefix=sha-,format=short

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # the compose.yml build of the site passes the same value
          build-args: |
            API_URL=http://api:8040
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # latest and the release tag point at the sha-<commit> images, and only once both of them are pushed
  tags:
    needs: image
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Move latest or the release tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          if [ "$REF_TYPE" = tag ]; then tag=$REF_NAME; else tag=latest; fi
          for name in modernsi-api modernsi-web; do
            image=ghcr.io/knate42/$name
            docker buildx imagetools create -t "$image:$tag" "$image:sha-${GITHUB_SHA::7}"
            echo "$image:$tag -> sha-${GITHUB_SHA::7}"
          done
